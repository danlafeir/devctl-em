name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # macOS runner required: darwin builds use CGO_ENABLED=1.
    # macOS can also cross-compile the pure-Go linux targets without issue.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out main so we can push the bridge binaries back.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag is on main
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if ! git merge-base --is-ancestor "${TAG}" main; then
            echo "Tag ${TAG} is not an ancestor of main; refusing to release."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Build all platforms
        run: make build-all

      - name: Verify version string
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(./bin/em --version)
          echo "Binary reports: $VERSION"
          echo "$VERSION" | grep -qF "$TAG" \
            || (echo "Binary --version does not contain $TAG" && exit 1)

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          HASH=$(git rev-parse --short HEAD)

          # Rename binaries to the clean platform names used as asset identifiers
          # by install.sh and `em update`.
          ASSETS_DIR=$(mktemp -d)
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            cp "bin/em-${platform}-${HASH}" "${ASSETS_DIR}/em-${platform}"
          done

          # Extract release notes from the annotated tag message.
          # deploy.sh stores them as: first line = title, rest = body.
          TAG_SUBJECT=$(git tag -l --format='%(subject)' "$TAG")
          TAG_BODY=$(git tag -l --format='%(body)' "$TAG")

          # Mark beta/alpha tags as pre-releases so `em update beta` can find them
          # without them appearing as the latest stable release.
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-beta* ]] || [[ "$TAG" == *-alpha* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "${TAG_SUBJECT:-$TAG}" \
            --notes "${TAG_BODY:-Released $TAG}" \
            $PRERELEASE_FLAG \
            "${ASSETS_DIR}/em-darwin-amd64" \
            "${ASSETS_DIR}/em-darwin-arm64" \
            "${ASSETS_DIR}/em-linux-amd64" \
            "${ASSETS_DIR}/em-linux-arm64"

      # BRIDGE: also commit hash-named binaries to bin/ so that users still
      # running the old `em update` (which reads the git contents API) can
      # receive this release and upgrade to the GitHub-Releases-based updater.
      # Remove this step once you are confident all active users have updated.
      - name: Commit bridge binaries to bin/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
            exit 0
          fi
          git commit -m "Release ${GITHUB_REF#refs/tags/} binaries"
          git push origin main
